name: PR 自动合并资格

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-auto-merge-eligibility-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: 验证自动合并资格
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出main基线上的可信检查器
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 获取待评审提交但不执行其中代码
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: 生成只读评审元数据
        env:
          EVENT_PATH: ${{ github.event_path }}
          METADATA_PATH: ${{ runner.temp }}/pr-auto-merge-metadata.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          pull_request = event["pull_request"]
          body = pull_request.get("body") or ""
          metadata = {
              "body": body,
              "base_ref": pull_request["base"]["ref"],
              "base_sha": pull_request["base"]["sha"],
              "head_ref": pull_request["head"]["ref"],
              "head_sha": pull_request["head"]["sha"],
              "pr_number": pull_request["number"],
              "repository": pull_request["base"]["repo"]["full_name"],
              "head_repository": pull_request["head"]["repo"]["full_name"],
          }
          merge_fact_sections = re.findall(
              r"(?ms)^## 关联合并事实\s*\n((?:\s*-\s*PR #\d+\s*\n?)+)",
              body,
          )
          referenced_pr_numbers = []
          if merge_fact_sections:
              referenced_pr_numbers = re.findall(
                  r"(?m)^\s*-\s*PR #(\d+)\s*$", merge_fact_sections[0]
              )
          if len(referenced_pr_numbers) > 2 or len(set(referenced_pr_numbers)) != len(referenced_pr_numbers):
              raise SystemExit("关联合并事实PR编号重复或超过上限")
          if referenced_pr_numbers:
              referenced = {}
              for number in referenced_pr_numbers:
                  result = subprocess.run(
                      ["gh", "api", f"repos/{pull_request['base']['repo']['full_name']}/pulls/{number}"],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
                  fact = json.loads(result.stdout)
                  referenced[number] = {
                      "number": fact.get("number"),
                      "state": fact.get("state"),
                      "merged_at": fact.get("merged_at"),
                      "merge_commit_sha": fact.get("merge_commit_sha"),
                      "base_ref": fact.get("base", {}).get("ref"),
                      "base_sha": fact.get("base", {}).get("sha"),
                      "base_repo": fact.get("base", {}).get("repo", {}).get("full_name"),
                      "head_sha": fact.get("head", {}).get("sha"),
                      "head_repo": fact.get("head", {}).get("repo", {}).get("full_name"),
                  }
              metadata["referenced_prs"] = referenced
          Path(os.environ["METADATA_PATH"]).write_text(
              json.dumps(metadata, ensure_ascii=False), encoding="utf-8"
          )
          PY

      - name: 验证自动合并资格
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          METADATA_PATH: ${{ runner.temp }}/pr-auto-merge-metadata.json
        run: |
          python3 scripts/研发中心/验证自动合并资格.py \
            --repo-root . \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --metadata "$METADATA_PATH"
